# =============================================================================
# TKXLAB.AI Development Environment Ultimate Tmux Config (Cross-Platform)
# =============================================================================

# -----------------------------------------------------------------------------
# 1. Base System & Low-Level Tuning
# -----------------------------------------------------------------------------
set -g mouse on
set -g history-limit 50000

# Force override word-separators for all windows: remove underscores and hyphens 
# to allow double-click selection of full variable names and long paths
setw -g word-separators " ='\"()[]{}<>"

# [Core Fix] Set escape-time to 50ms. Ensures smooth Vim operation while 
# preventing JetBrains/VSCode conflicts
set -sg escape-time 50
set -g focus-events on

# Enable OSC52 clipboard passthrough protocol
set -s set-clipboard on

# Allow TUI apps (opencode / claude-code / nvim / etc) inside tmux to send OSC
# sequences through to the outer terminal — without this, mouse-selection
# "copy to clipboard" in opencode gets swallowed by tmux and never reaches pbcopy.
set -g allow-passthrough on
set -as terminal-features ',*:clipboard'

# Ensure environment variables remain valid upon reconnecting to Tmux
set -g update-environment "DISPLAY WAYLAND_DISPLAY XDG_RUNTIME_DIR WSL_DISTRO_NAME WSL_INTEROP SSH_AUTH_SOCK SSH_CONNECTION"

# True color support & rendering optimization
set -g default-terminal "tmux-256color"
set -sa terminal-features ',xterm-256color:RGB'
set -sa terminal-overrides ',xterm-256color:Tc'

# -----------------------------------------------------------------------------
# 2. UI Interaction & Status Bar Aesthetics (Visual Focus Design)
# -----------------------------------------------------------------------------
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# ==========================================
# Top HUD: Independent Pane Status Bar
# ==========================================
set -g pane-border-status top

# Uniform colour235 background, maintaining a monochrome Nerd Font icon style
# Cross-platform IP retrieval: macOS/Linux compatible, using cut instead of awk 
# to prevent variable escaping
set -g pane-border-format "#[align=left]#[bg=colour235,fg=cyan] IP: #(uname -s | grep -q Darwin && ipconfig getifaddr en0 || hostname -I | cut -d' ' -f1) #[align=right]#[bg=colour235,fg=blue]  #{pane_current_path} #[default]"

set -g pane-active-border-style "bg=default,fg=blue"
set -g pane-border-style "bg=default,fg=colour235"

# ==========================================
# Bottom Global: Classic Console Status Bar
# ==========================================
set-option -g status-position bottom
set -g status-style bg=colour235,fg=white
set -g status-right-length 200
set -g status-left-length 100

# Left: Display current session name
set -g status-left "#[fg=blue,bold] 󱫋 #S #[default] "

# Center: Window list (Core visual reconstruction)
set -g status-justify left

# --- [Core Injection] Dynamic window naming engine ---
set-option -g automatic-rename on
set-option -g automatic-rename-format "#{b:pane_current_path} #{pane_current_command}"
# -----------------------------------

# 1. Inactive windows: Use colour237 (slightly lighter than base) as block 
# background, soft gray text to reduce visual noise
setw -g window-status-format "#[fg=colour246,bg=colour237] #I:#W "

# 2. Active window: Highlight cyan background, dark text, bold, prefixed 
# with a solid star to establish absolute visual focus
setw -g window-status-current-format "#[fg=colour235,bg=cyan,bold] ★ #I:#W "

# Right: Smart path folding + Server hostname (#H)
set -g status-right "#[fg=blue] #{s|^$HOME|~|;s|([^/]+)/([^/]+)/([^/]+)$|.../\\2/\\3|:pane_current_path} #[fg=default]| #[fg=cyan,bold]󰒋 #H "

# Activity monitoring
setw -g monitor-activity on
set -g visual-activity off

# -----------------------------------------------------------------------------
# 3. DevOps Console (Floating Menu & Quick Clicks)
# -----------------------------------------------------------------------------
# Floating popup
bind-key e display-popup -E -w 80% -h 80%

# Status bar left-click event
bind-key -n MouseUp1StatusLeft choose-tree -s

# Right-click menu
bind-key -n MouseDown3Pane display-menu -T " DevOps Console " \
    "New Window"            n "new-window" \
    "Split Vertical"        v "split-window -h" \
    "Split Horizontal"      s "split-window -v" \
    "" \
    "Switch Session/Window" w "choose-tree -s" \
    "Rename Window"         r "command-prompt -I '#W' 'rename-window %%'" \
    "" \
    "Kill Current Pane"     x "kill-pane" \
    "Kill Current Window"   q "kill-window"

# -----------------------------------------------------------------------------
# 4. Pane Navigation & Keybindings System
# -----------------------------------------------------------------------------
# Quick switch with vim keys
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind z resize-pane -Z

# Cluster troubleshooting core: Synchronize input to all panes
bind S setw synchronize-panes   

# Global mouse toggle switch
bind m set -g mouse on \; display "Mouse: ON"
bind M set -g mouse off \; display "Mouse: OFF"

# Architect reload key
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# Session management
bind s choose-tree -Zs
bind X confirm-before -p "Kill session #S? (y/n)" kill-session

# -----------------------------------------------------------------------------
# 5. Cross-Platform Vi Copy & Smart Text Trimming Logic (External Script)
# -----------------------------------------------------------------------------
setw -g mode-keys vi

# Optimize mouse scroll
bind -T copy-mode-vi WheelUpPane select-pane \; send-keys -X -N 2 scroll-up
bind -T copy-mode-vi WheelDownPane select-pane \; send-keys -X -N 2 scroll-down

# Basic selection keybindings
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'C-v' send -X rectangle-toggle

# Core trimming logic: Keyboard copy (y/Enter) delegated to external script
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "~/.tmux/trim_copy.sh"
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "~/.tmux/trim_copy.sh"

# Core trimming logic: Auto-trim and copy upon mouse drag release
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "~/.tmux/trim_copy.sh"

# Core trimming logic: Smart triple-click (IDE concession + Full line copy & trim)
bind-key -n TripleClick1Pane \
    if-shell -F "#{mouse_any_flag}" \
    "send-keys -M" \
    "copy-mode -M ; send-keys -X select-line ; run-shell 'sleep 0.05' ; send-keys -X copy-pipe-and-cancel '~/.tmux/trim_copy.sh'"

# Core trimming logic: Smart double-click (IDE concession + Word copy & trim)
bind-key -n DoubleClick1Pane \
    if-shell -F "#{mouse_any_flag}" \
    "send-keys -M" \
    "copy-mode -M ; send-keys -X select-word ; run-shell 'sleep 0.05' ; send-keys -X copy-pipe-and-cancel '~/.tmux/trim_copy.sh'"

# Fallback anti-deadlock logic: Prevent double/triple clicks in copy-mode from invalidating keys
bind-key -T copy-mode-vi DoubleClick1Pane send-keys -X select-word \; send-keys -X copy-pipe-and-cancel "~/.tmux/trim_copy.sh"
bind-key -T copy-mode-vi TripleClick1Pane send-keys -X select-line \; send-keys -X copy-pipe-and-cancel "~/.tmux/trim_copy.sh"
